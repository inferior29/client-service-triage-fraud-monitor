[project]
name = "triage-monitor"
version = "0.1.0"
description = "AI-assisted client service triage and fraud-flag monitor (synthetic data)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
